name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specific test file to run (leave empty for all)'
        required: false
        default: ''
      browser:
        description: 'Browser to use'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Install dependencies
      working-directory: packages/playwright-tests  # ← ADD THIS
      run: npm ci  # Now works because it's in the right folder
    
    - name: Install Playwright Browsers
      working-directory: packages/playwright-tests  # ← ADD THIS
      run: npx playwright install --with-deps chromium
    
    - name: Run Playwright tests
      working-directory: packages/playwright-tests  # ← ADD THIS
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: packages/playwright-tests/playwright-report/
        retention-days: 30